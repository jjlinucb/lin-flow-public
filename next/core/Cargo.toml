[package]
name = "linflow-core"
description = "Lin Flow's shared core: the text pipeline, learning, the file formats and sync."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
fancy-regex = "0.14"
regex = "1"
unicode-segmentation = "1"
unicode-properties = "0.1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
uuid = { version = "1", features = ["v4"] }
rubato = "0.16"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "aac", "isomp4", "flac", "ogg", "vorbis"] }
# The operating system's TLS (Security framework, SChannel): no C to compile for either target.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
unicode-normalization = "0.1.25"

[dev-dependencies]
proptest = "1"
