[package]
name = "lin-flow-next"
description = "Lin Flow Next: the Tauri app around the service, with the dashboard, the pill, the toasts and the menu bar icon."
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "lin-flow-next"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
linflow-core = { path = "../../core" }
linflow-service = { path = "../../service" }
linflow-platform = { path = "../../platform" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
libc = "0.2"
trash = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
