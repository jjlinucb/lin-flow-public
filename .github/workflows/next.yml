# Lin Flow Next on GitHub's runners: the core, the laws and the window on Linux, and the whole app
# built and tested on Windows, the system the Mac can only cross-check. The Mac runs the same
# commands on John's machine. What needs a person (the talk key, a microphone, a call) is listed in
# rebuild/verification.md.
#
# Cost, since 2026-10-14. GitHub bills a Windows minute as two, and this account's 2,000 included
# minutes reached 90% with eighteen days still to run. The tests and the lint were two jobs side by
# side with a cache key each, which is quick on the clock and pays to compile the workspace's
# dependencies twice; they are one job now, and clippy reuses what the tests built. The release
# build stays separate and on main only: it optimizes the app's own code every time, so it shares
# nothing worth sharing. Each job keeps its compiled dependencies in a cache saved from main, which
# pull requests read too, so a run compiles only what changed. Debug info is off, since CI never
# reads it and it made every build, link and cache bigger. A newer push to a pull request cancels
# the run it replaces.
name: next

on:
  push:
    branches: [main]
    paths: ["next/**", ".github/workflows/next.yml"]
  pull_request:
    paths: ["next/**", ".github/workflows/next.yml"]
  workflow_dispatch:

concurrency:
  group: next-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: next

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next/app/package-lock.json

      - name: The window's tests and types
        working-directory: next/app
        run: |
          npm ci
          npm test
          npm run build

      - name: Rust
        run: rustup update stable && rustup default stable && rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: next
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The app itself needs WebKitGTK on Linux, and nobody runs it there. Everything under it
      # builds against the platform crate's stand-ins.
      - name: Tests, the laws among them
        run: cargo test --workspace --exclude lin-flow-next --no-fail-fast

      - name: Lint
        run: cargo clippy --workspace --exclude lin-flow-next --all-targets -- -D warnings

  # Tests and lint were two matrix jobs, side by side, for wall-clock speed. They are one job
  # again because wall clock is not what this repo is short of: GitHub bills a Windows minute as
  # two, each job carried its own rust-cache key, and so the workspace's dependencies were
  # compiled twice to be looked at twice. In October that reached 90% of the account's 2,000
  # included minutes with the reset still eighteen days out, and nothing else on the account
  # spends them.
  #
  # Sequential costs minutes only where the work is genuinely separate; here clippy follows a
  # build that has already compiled every dependency, and reuses it. Both checks still run, on
  # pull requests and on main, which is why this is the trade taken rather than moving lint to
  # main alone.
  #
  # It builds the window first, because the app embeds the built pages and does not compile
  # without them.
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: next

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next/app/package-lock.json

      - name: The window
        working-directory: next/app
        run: |
          npm ci
          npm run build

      - name: Rust
        run: rustup update stable && rustup default stable && rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: next
          key: checks
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Here the engine's layout test checks whisper.cpp's structs as MSVC lays them out. Every
      # crate's tests run even after one fails, so a single run shows all that Windows breaks.
      - name: tests
        run: cargo test --workspace --no-fail-fast

      # Runs even when the tests failed, so one run still reports everything Windows has to say.
      - name: lint
        if: '!cancelled()'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Update in Settings hands the swap to scripts/update-swap.ps1. Here it runs, under Windows
      # PowerShell as the app starts it, on a made-up install: one zip that swaps in, and one with
      # no app in it that must leave the old copy where it was.
      - name: update swap
        if: '!cancelled()'
        shell: pwsh
        run: |
          cargo build -p linflow-cli
          $t = Join-Path $env:RUNNER_TEMP 'swap'
          $dest = Join-Path $t 'Lin Flow Next'
          $pkg = Join-Path $t 'pkg'
          New-Item -ItemType Directory -Force $dest, (Join-Path $pkg 'native') | Out-Null
          Set-Content (Join-Path $dest 'old.txt') 'old'
          Copy-Item target/debug/linflow.exe $pkg
          Copy-Item C:/Windows/System32/whoami.exe (Join-Path $pkg 'lin-flow-next.exe')
          Set-Content (Join-Path $pkg 'native/new.txt') 'new'
          $zip = Join-Path $t 'lin-flow-next-windows.zip'
          Compress-Archive (Join-Path $pkg '*') $zip
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/update-swap.ps1 -Zip $zip -Dest $dest -ProcId 0
          if (-not (Test-Path (Join-Path $dest 'native/new.txt'))) { throw 'the new copy was not swapped in' }
          if (Test-Path (Join-Path $dest 'old.txt')) { throw 'the old copy is still there' }
          if (Test-Path "$dest.old") { throw 'the old folder was left behind' }
          Remove-Item -Recurse -Force $pkg
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Set-Content (Join-Path $pkg 'readme.txt') 'no app here'
          Compress-Archive (Join-Path $pkg '*') $zip
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/update-swap.ps1 -Zip $zip -Dest $dest -ProcId 0
          if (-not (Test-Path (Join-Path $dest 'native/new.txt'))) { throw 'a bad zip replaced the install' }
          Get-Content (Join-Path $env:TEMP 'lin-flow-next-update.log')

  # Tests and lint already compile every line of the app on a pull request. The optimized build
  # waits for main, where a release would come from.
  windows-app:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 45
    # To replace the windows-latest release that Check for updates reads.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: next

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next/app/package-lock.json

      - name: The window
        working-directory: next/app
        run: |
          npm ci
          npm run build

      - name: Rust
        run: rustup update stable && rustup default stable && rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: next
          key: app
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tauri/custom-protocol is what `tauri build` turns on: it packs the window's pages into the
      # exe. Without it a plain cargo build points the window at the dev server, localhost:1420, and
      # every build from this job before 2026-10-27 opened to "localhost refused to connect".
      - name: Build the app
        run: |
          cargo build --release -p lin-flow-next --features tauri/custom-protocol
          cargo build --release -p linflow-cli

      # One folder a Windows computer can run as it is, without Rust or MSVC: the app, the CLI and
      # whisper.cpp's DLLs in `native`, where the engine looks. `next/scripts/windows.ps1` fetches
      # it from the newest green run on main and installs it; `gh run download -n
      # lin-flow-next-windows` gets the same zip by hand. The DLLs are the v1.9.1 release, the
      # whisper.cpp the Mac builds against.
      - name: Put the app together
        shell: pwsh
        run: |
          $out = 'dist/windows'
          New-Item -ItemType Directory -Force "$out/native" | Out-Null
          Copy-Item target/release/lin-flow-next.exe, target/release/linflow.exe $out
          $zip = Join-Path $env:RUNNER_TEMP 'whisper-bin-x64.zip'
          Invoke-WebRequest https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.1/whisper-bin-x64.zip -OutFile $zip
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'whisper') -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'whisper/Release/*.dll') "$out/native"
          & "$out/linflow.exe" version
          # The window's pages are inside the exe, or the build stops here before anyone gets it.
          $exe = [IO.File]::ReadAllText((Resolve-Path "$out/lin-flow-next.exe"), [Text.Encoding]::GetEncoding(28591))
          if ($exe -notmatch '/assets/main-[\w-]+\.js') { throw 'lin-flow-next.exe has no window pages in it; it would open localhost:1420.' }
          Get-ChildItem -Recurse $out | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: lin-flow-next-windows
          path: next/dist/windows
          if-no-files-found: error
          retention-days: 30

      # Check for updates in the Windows app's Settings reads this release (next/core/src/update.rs).
      # A release asset downloads without a GitHub sign-in, which a CI artifact does not. One release,
      # replaced on every green build of main, aimed at the commit it was built from. Only on main, so
      # a manual run from a branch never reaches the laptops.
      - name: Publish for Check for updates
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'lin-flow-next-windows.zip'
          Compress-Archive -Path dist/windows/* -DestinationPath $zip -Force
          $short = $env:GITHUB_SHA.Substring(0, 7)
          gh release delete windows-latest --yes --cleanup-tag 2>$null
          gh release create windows-latest $zip --target $env:GITHUB_SHA --prerelease --latest=false `
            --title "Lin Flow Next for Windows, $short" `
            --notes "Built from $env:GITHUB_SHA on main. Settings > App > Check for updates installs it; nothing updates by itself."
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
